services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: medicore-keycloak
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
volumes:
  keycloak_data:
    name: medicore-gateway_keycloak_data